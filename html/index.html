
<html>
    <head>
        <title>Examen de Desarrollo web en entorno servidor</title>
        <link rel="stylesheet" type="text/css" href="../estilos/estilos.css">
        <link rel="icon" type="image/png" sizes="32x32" href="../imagenes/favicon.jpeg">
    </head>
    <body>
        <h1>Centro de Ayuda al Empleo</h1>
        <h2>Formulario de solicitud</h2>

        <!-- Botones para ver las tablas -->
        <button onclick="location.href='../php/tabla.php?tipo=soldadura'">Soldadura</button>
        <button onclick="location.href='../php/tabla.php?tipo=informatica'">Informatica</button>
        <button onclick="location.href='../php/tabla.php?tipo=socio'">Sociosanitaria</button>

        <!-- Formulario con metodo POST para mayor seguridad, conectada a XAMPP y a la tabla CAE de mysql -->
        <form action="../php/CAE.php" method="post">

            <label>Nombre:</label>
            <input type="text" name="nombre" required>

            <label>Apellidos:</label>
            <input type="text" name="apellidos" required>

            <label>DNI:</label>
            <input type="text" name="dni" required>

            <label>Fecha de nacimiento:</label>
            <input type="date" name="f_nac" required>

            <label>Telefono:</label>
            <input type="text" name="tlf" required>

            <label>Email:</label>
            <input type="email" name="email" required>

            <!-- Apartado OBLIGATORIO para saber la profesion estudiada, solo se pueden elegir las opciones disponibles -->
            <label>Profesion estudiada:</label>
            <select name="profesion" required>
                <option value="Soldadura">Soldadura</option>
                <option value="Informatica">Informatica</option>
                <option value="Sociosanitaria">Sociosanitaria</option>
            </select>
            
            <!-- Radio buttons para elegir la jornada, solo se puede elegir una opcion -->
            <label>Jornada:</label>
            <input type="radio" name="jornada" value="Parcial" required> Parcial
            <input type="radio" name="jornada" value="Completa" required> Completa

            <label>Idiomas:</label>
            <input type="checkbox" name="euskera" value="1"> Euskera
            <!-- Value=1 porque en la base de datos son de tipo BOOLEAN, 0=FALSE, 1=TRUE -->
            <!-- Tambien podriamos utilizar tipo varchar "si" y "no", y ENUM("si", "no") para Sql-->

            <input type="checkbox" name="ingles" value="1"> Ingles
            <!-- Boton para enviar los datos a la base de datos -->
            <br><br>
            <button type="submit">Enviar solicitud</button>

        </form>
    </body>
</html>
